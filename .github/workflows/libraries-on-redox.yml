# Fork-only. Do not merge this file to next or develop.
# This branch points the job at the nimo-serai self-hosted runner, skips the
# sudo apt/udev steps (nimo already has qemu, jq, and writable /dev/kvm), and
# keeps the redoxer install and test steps.
name: Test Libraries on Redox
permissions: {}

on:
  push:
    branches:
      - develop
      - next
      - bot/ci-nimo-redox
    paths:
      - "common/**"
      - "crypto/**"
      - "coordinator/tributary-framework/tendermint/*"
      - ".github/workflows/libraries-on-redox.yml"

  pull_request:
    paths:
      - "common/**"
      - "crypto/**"
      - "coordinator/tributary-framework/tendermint/*"

  workflow_dispatch:

jobs:
  test-redox:
    name: Test Libraries on Redox
    runs-on: nimo-serai

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU
        if: runner.name != 'nimo-serai'
        run: sudo apt update -y && sudo apt upgrade -y && sudo apt install -y qemu-system-x86 jq

      - name: Enable KVM
        if: runner.name != 'nimo-serai'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # nimo has no rust on the default PATH. Reuse the existing user rustup
      # under ~/DEVELOP/serai/tmp so we do not install a second copy into
      # ~/.rustup. no-cache below skips musl static linking (musl-tools is
      # not installed) and the action's ~/.cargo/bin check.
      - name: Put user Rust on PATH (nimo)
        if: runner.name == 'nimo-serai'
        shell: bash
        run: |
          set -euo pipefail
          CARGO_HOME=/home/mark/DEVELOP/serai/tmp/cargo-home
          RUSTUP_HOME=/home/mark/DEVELOP/serai/tmp/rustup-home
          test -x "$CARGO_HOME/bin/cargo"
          test -x "$CARGO_HOME/bin/rustup"
          # GITHUB_PATH only applies to later steps. Export PATH in this
          # step too, or cargo/rustc are not found here.
          export CARGO_HOME RUSTUP_HOME
          export PATH="$CARGO_HOME/bin:${PATH:-}"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          cargo +1.100 --version
          rustc +1.100 --version

      - name: Install `redoxer`
        uses: ./.github/actions/cargo-install
        with:
          crate: redoxer
          version: 0.2.63
          no-cache: true

      - name: Run Tests for Libraries on Redoxer
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_CI=true
          export RUST_BACKTRACE=1

          # redoxer 0.2.63 always installs under $HOME/.redoxer/<target>.
          # Keep that tree inside ~/DEVELOP so nothing is written to
          # /home/mark/.redoxer. CARGO_HOME and RUSTUP_HOME stay absolute.
          if [ "${RUNNER_NAME:-}" = "nimo-serai" ]; then
            export HOME=/home/mark/DEVELOP/serai/tmp/redoxer-home
            mkdir -p "$HOME"
          fi

          ACCEL="kvm"
          if [ ! -w /dev/kvm ]; then
            # Don't use `kvm` which isn't supported here
            ACCEL="tcg"
          fi
          # Add an explicit audio device as else `audiod` fails to initialize and the booting fails
          export REDOXER_QEMU_ARGS="-smp $(nproc) -accel $ACCEL -audio none,model=ac97"
          export TARGET=x86_64-unknown-redox

          redoxer toolchain

          CRATES=$(find ./common ./crypto ./coordinator/tributary-framework/tendermint -name "Cargo.toml")
          echo "$CRATES" | while IFS="\n" read -r manifest; do
            FEATURES="--all-features"
            if [ "$manifest" = "./common/db/Cargo.toml" ]; then
              FEATURES=""
            fi
            # zalloc uses allocator_api, stable only in rustc 1.100+.
            # redoxer 0.2.63 ships rustc 1.98.0-dev, so it cannot compile zalloc.
            # No other crate in this job depends on zalloc.
            if [ "$manifest" = "./common/zalloc/Cargo.toml" ]; then
              echo "Skipping $manifest: allocator_api needs rustc 1.100; redoxer is 1.98.0-dev"
              continue
            fi

            # We apply optimizations as the time to emulate slow code is far
            # more than the time it to takes to output faster code
            export RUSTFLAGS="${RUSTFLAGS:-} -C opt-level=3"
            # Build the tests, without running them, and extract their absolute paths via `jq`
            # redoxer 0.2.63 ships rustc 1.98.0-dev; zalloc on next requires 1.100.
            TESTS=$(redoxer test -- "$FEATURES" --manifest-path "$manifest" --no-run --message-format=json --ignore-rust-version | jq -r '.executable | select(. != null)')
            # An empty TESTS would be rewritten to /root by the sed below, so skip.
            if [ -z "${TESTS}" ]; then
              echo "No test executables for $manifest, skipping exec"
              continue
            fi
            # Convert our filesystem's absolute paths to what will be Redox's absolute paths
            TESTS=$(echo "$TESTS" | sed s/$(pwd | sed s/'\/'/'\\\/'/g)//g | sed s/'^'/'\/root'/g)
            echo "$TESTS" | while IFS="\n" read -r test; do
              [ -n "$test" ] || continue
              # The nimo-serai runner unit sets NoNewPrivileges=yes, which
              # blocks setuid fusermount3. redoxer exec needs FUSE, so run
              # only that command in a transient user unit without it.
              if [ "${RUNNER_NAME:-}" = "nimo-serai" ]; then
                systemd-run --user --wait --pipe --collect \
                  --property=NoNewPrivileges=no \
                  --unit="nimo-redoxer-exec-${GITHUB_RUN_ID:-$$}-${RANDOM}" \
                  --working-directory="$PWD" \
                  -E HOME -E PATH -E CARGO_HOME -E RUSTUP_HOME \
                  -E TARGET -E REDOXER_QEMU_ARGS -E RUSTFLAGS \
                  -E RUST_BACKTRACE -E GITHUB_CI -E RUNNER_NAME \
                  -- redoxer exec --folder '.:/root' "$test"
              else
                redoxer exec --folder '.:/root' "$test"
              fi
            done
          done
